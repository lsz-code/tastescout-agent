# HTTPS certificate files must exist before starting nginx:
#   ./deploy/nginx/certs/live/www.tastescout-agent.xin/fullchain.pem
#   ./deploy/nginx/certs/live/www.tastescout-agent.xin/privkey.pem
#
# If the files do not exist, issue them first with Certbot standalone mode:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm --service-ports certbot
#
# Production one-command deployment after certificates exist:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: tastescout-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tastescout-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  amap-mcp-proxy:
    build:
      context: ./amap_mcp_proxy
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    container_name: tastescout-amap-mcp-proxy
    env_file:
      - .env.prod
    expose:
      - "8010"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    container_name: tastescout-backend
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      amap-mcp-proxy:
        condition: service_started
    expose:
      - "8000"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_AMAP_JS_KEY: ${NEXT_PUBLIC_AMAP_JS_KEY}
    container_name: tastescout-frontend
    env_file:
      - .env.prod
    depends_on:
      backend:
        condition: service_started
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: tastescout-nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE}
      NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/certs:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: tastescout-certbot
    profiles:
      - certbot
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/certs:/etc/letsencrypt
    command: >
      certonly
      --standalone
      --preferred-challenges=http
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      -d ${PUBLIC_DOMAIN}

volumes:
  postgres_data:
  redis_data:
